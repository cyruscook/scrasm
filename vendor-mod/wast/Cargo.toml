# Modified for Scrasm; see NOTICE.md for upstream attribution and changes.
[package]
name = "wasmi_wast"
license = "MIT"
authors = ["Robin Freyler <robin.freyler@gmail.com>"]
repository = "https://github.com/wasmi-labs/wasmi"
documentation = "https://docs.rs/wasmi_wast"
description = "Utilities to execute Wast files and directives with Wasmi"
edition = "2024"

[dependencies]
wasmi = { version = "0.51.5", features = ["std", "simd"] }
wast = { version = "240.0.0", features = ["wasm-module"] }
anyhow = "1.0.104"
