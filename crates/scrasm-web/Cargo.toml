[package]
name = "scrasm-web"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
scrasm = { path = "../.." }
serde_json = "1.0.151"
serde_ignored = "0.1.14"
wasm-bindgen = "=0.2.121"
wasmparser = "0.240.0"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }

[dev-dependencies]
wasmi = "0.51.5"
wast = "240.0.0"
