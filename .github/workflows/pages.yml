name: Browser workbench

on:
  pull_request:
    paths: ['site/**', 'crates/scrasm-web/**', 'src/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/pages.yml']
  push:
    branches: [main]
    paths: ['site/**', 'crates/scrasm-web/**', 'src/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version: 1.6.0
          working-directory: site
          cache: true
          run-install: |
            args: ['--frozen-lockfile']
      - run: cargo install wasm-bindgen-cli --version 0.2.121 --locked
      - run: cargo test --locked -p scrasm-web
      - run: vp check --deny-warnings
        working-directory: site
      - run: vp run build
        working-directory: site
      - run: vp test --run
        working-directory: site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
